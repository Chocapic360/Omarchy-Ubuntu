# https://wiki.hypr.land/Configuring/Basics/Window-Rules/ (Hyprland 0.53+ syntax)

# Apps can't maximize themselves out of the tiling layout
windowrule = suppress_event maximize, match:class .*

# Slight transparency on everything (apps below can opt out)
windowrule = tag +default-opacity, match:class .*

# Fix some XWayland dragging issues
windowrule = no_focus on, match:class ^$, match:title ^$, match:xwayland 1, match:float 1, match:fullscreen 0, match:pin 0

# Float small utility windows, Omarchy-style
windowrule = float on, match:class ^(org.pulseaudio.pavucontrol|blueman-manager|nm-connection-editor|org.gnome.Calculator)$
windowrule = size 875 600, match:class ^(org.pulseaudio.pavucontrol|blueman-manager|nm-connection-editor)$
windowrule = center on, match:class ^(org.pulseaudio.pavucontrol|blueman-manager|nm-connection-editor|org.gnome.Calculator)$

# Floating terminal used by the menus and TUIs (omu-launch-terminal --float)
windowrule = float on, match:class ^omu\.floating$
windowrule = size 1000 640, match:class ^omu\.floating$
windowrule = center on, match:class ^omu\.floating$

# Video and image apps stay fully opaque
windowrule = tag -default-opacity, match:class ^(mpv|vlc|org.gnome.Loupe|imv|com.obsproject.Studio)$
windowrule = tag -default-opacity, match:title .*(YouTube|Netflix|Twitch).*

# Picture-in-picture: float, pin and park in the top-right corner (same as Omarchy)
windowrule = tag +pip, match:title (Picture.?in.?[Pp]icture)
windowrule = tag -default-opacity, match:tag pip
windowrule = float on, match:tag pip
windowrule = pin on, match:tag pip
# Width 600, height from the shape Zen opens it at, so the video fills it with no black bars
windowrule = size 600 (600*window_h/window_w), match:tag pip
windowrule = keep_aspect_ratio on, match:tag pip
windowrule = border_size 0, match:tag pip
windowrule = move (monitor_w-window_w-40) (monitor_h*0.04), match:tag pip

# Flameshot's region picker: an opaque overlay over the whole screen
windowrule = tag -default-opacity, match:class ^flameshot$
windowrule = float on, match:class ^flameshot$
windowrule = move 0 0, match:class ^flameshot$
windowrule = pin on, match:class ^flameshot$
windowrule = no_anim on, match:class ^flameshot$
windowrule = border_size 0, match:class ^flameshot$
windowrule = rounding 0, match:class ^flameshot$
windowrule = no_shadow on, match:class ^flameshot$

# Apply default opacity last
windowrule = opacity 0.97 0.9, match:tag default-opacity

# Menus and region selection appear instantly (fuzzel = "launcher", slurp = "selection")
layerrule = no_anim on, match:namespace launcher
layerrule = no_anim on, match:namespace selection
