# Laptop idle chain: dim 2.5 min -> lock 5 min -> screen off 5.5 min -> suspend 15 min (on battery)
general {
    lock_cmd = omu-lock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
    inhibit_sleep = 3
}

# Dim the screen (restores previous brightness on activity)
listener {
    timeout = 150
    on-timeout = brightnessctl -s set 10%
    on-resume = brightnessctl -r
}

# Lock
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# Screen off
listener {
    timeout = 330
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on && brightnessctl -r
}

# Suspend, but only when running on battery
listener {
    timeout = 900
    on-timeout = omu-suspend-on-battery
}
