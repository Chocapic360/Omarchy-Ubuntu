# Menus (Omarchy 4 layout: Super + Space = Omarchy menu, Super + Alt + Space = apps)
bindd = SUPER, SPACE, Omarchy menu, exec, omu-menu
bindd = SUPER ALT, SPACE, Launch apps, exec, omu-launcher
bindd = SUPER, ESCAPE, System menu, exec, omu-menu system
bindld = , XF86PowerOff, Power menu, exec, omu-menu system
bindd = SUPER, K, Show key bindings, exec, omu-menu-keybindings
bindd = SUPER CTRL, C, Capture menu, exec, omu-menu capture
bindd = SUPER CTRL, O, Toggle menu, exec, omu-menu toggle
bindd = , XF86Calculator, Calculator, exec, gnome-calculator

# Aesthetics
bindd = SUPER SHIFT, SPACE, Toggle top bar, exec, omu-toggle-waybar
bindd = SUPER CTRL, SPACE, Background menu, exec, omu-menu background
bindd = SUPER, BACKSPACE, Toggle window transparency, exec, omu-toggle-transparency
bindd = SUPER SHIFT, BACKSPACE, Toggle window gaps, exec, omu-toggle-gaps

# Notifications
bindd = SUPER, COMMA, Dismiss last notification, exec, makoctl dismiss
bindd = SUPER SHIFT, COMMA, Dismiss all notifications, exec, makoctl dismiss --all
bindd = SUPER CTRL, COMMA, Toggle silencing notifications, exec, omu-toggle-notification-silencing
bindd = SUPER ALT, COMMA, Invoke last notification, exec, makoctl invoke
bindd = SUPER SHIFT ALT, COMMA, Restore last notification, exec, makoctl restore

# Toggles
bindd = SUPER CTRL, I, Toggle locking on idle, exec, omu-toggle-idle
bindd = SUPER CTRL, N, Toggle nightlight, exec, omu-toggle-nightlight

# Captures
bindd = , PRINT, Screenshot, exec, omu-screenshot region
bindd = SHIFT, PRINT, Screenshot of screen, exec, omu-screenshot output
bindd = SUPER, PRINT, Color picker, exec, omu-color-picker

# Waybar-less information
bindd = SUPER CTRL ALT, T, Show time, exec, notify-send -u low "    $(date +"%A %H:%M  ·  %d %B %Y  ·  Week %V")"
bindd = SUPER CTRL ALT, B, Show battery remaining, exec, notify-send -u low "$(omu-battery-status)"

# Control panels
bindd = SUPER CTRL, A, Audio controls, exec, pavucontrol
bindd = SUPER CTRL, B, Bluetooth controls, exec, blueman-manager
bindd = SUPER CTRL, W, Wifi controls, exec, omu-launch-tui nmtui
bindd = SUPER CTRL, T, Activity, exec, omu-launch-tui btop

# Zoom
bindd = SUPER CTRL, Z, Zoom in, exec, hyprctl keyword cursor:zoom_factor $(hyprctl getoption cursor:zoom_factor -j | jq '.float + 1')
bindd = SUPER CTRL ALT, Z, Reset zoom, exec, hyprctl keyword cursor:zoom_factor 1

# Lock system
bindd = SUPER CTRL, L, Lock system, exec, omu-lock
