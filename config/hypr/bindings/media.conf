# Laptop media keys (OSD via SwayOSD when installed, otherwise a notification)
bindeld = , XF86AudioRaiseVolume, Volume up, exec, omu-volume up
bindeld = , XF86AudioLowerVolume, Volume down, exec, omu-volume down
bindeld = , XF86AudioMute, Mute, exec, omu-volume mute
bindeld = , XF86AudioMicMute, Mute microphone, exec, omu-volume mic-mute
bindeld = , XF86MonBrightnessUp, Brightness up, exec, omu-brightness up
bindeld = , XF86MonBrightnessDown, Brightness down, exec, omu-brightness down

# Precise 1% steps with ALT
bindeld = ALT, XF86AudioRaiseVolume, Volume up precise, exec, omu-volume up 1
bindeld = ALT, XF86AudioLowerVolume, Volume down precise, exec, omu-volume down 1
bindeld = ALT, XF86MonBrightnessUp, Brightness up precise, exec, omu-brightness up 1
bindeld = ALT, XF86MonBrightnessDown, Brightness down precise, exec, omu-brightness down 1

# Media players (playerctl)
bindld = , XF86AudioNext, Next track, exec, playerctl next
bindld = , XF86AudioPause, Pause, exec, playerctl play-pause
bindld = , XF86AudioPlay, Play, exec, playerctl play-pause
bindld = , XF86AudioPrev, Previous track, exec, playerctl previous
