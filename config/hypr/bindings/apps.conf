# Application bindings (Omarchy layout, Ubuntu apps)
bindd = SUPER, RETURN, Terminal, exec, alacritty
bindd = SUPER SHIFT, RETURN, Browser, exec, omu-launch-browser
bindd = SUPER SHIFT, B, Browser, exec, omu-launch-browser
bindd = SUPER SHIFT ALT, B, Browser (private), exec, omu-launch-browser --private
bindd = SUPER SHIFT, F, File manager, exec, nautilus --new-window
bindd = SUPER SHIFT, N, Editor, exec, omu-launch-editor
bindd = SUPER SHIFT, T, Activity (btop), exec, omu-launch-tui btop

# Add your own below, or in ~/.config/hypr/local.conf
# bindd = SUPER SHIFT, Y, YouTube, exec, omu-launch-browser --app=https://youtube.com
