# Share only the variables apps need with systemd/dbus (not --all), so nothing
# Hyprland-specific like ADW_DEBUG_COLOR_SCHEME can leak into a later GNOME login.
# omu-session removes them again when Hyprland exits.
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE XDG_SESSION_DESKTOP HYPRLAND_INSTANCE_SIGNATURE ADW_DEBUG_COLOR_SCHEME QT_QPA_PLATFORM ELECTRON_OZONE_PLATFORM_HINT MOZ_ENABLE_WAYLAND

exec-once = omu-bg-restore
exec-once = waybar
exec-once = mako
exec-once = hypridle
exec-once = omu-power-key-inhibit
exec-once = omu-polkit-agent
exec-once = command -v swayosd-server >/dev/null && swayosd-server

# Clipboard history (Super + Ctrl + V)
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

# Automatic timezone from your public IP, following GNOME's "Automatic Time Zone" switch.
exec-once = omu-auto-timezone
