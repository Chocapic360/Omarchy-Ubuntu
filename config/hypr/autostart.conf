# Push the session environment into systemd/dbus so apps launch fast
exec-once = dbus-update-activation-environment --systemd --all
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE HYPRLAND_INSTANCE_SIGNATURE

exec-once = omu-bg-restore
exec-once = waybar
exec-once = mako
exec-once = hypridle
exec-once = omu-polkit-agent
exec-once = command -v swayosd-server >/dev/null && swayosd-server

# Clipboard history (Super + Ctrl + V)
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
