# Omarchy-for-Ubuntu Hyprland config (targets Hyprland 0.53.x from Ubuntu 26.04)
# Structure follows Omarchy 3.8: small files, each with one job.
# Docs: https://wiki.hypr.land/Configuring/

# Theme colours first, so every file below can use $activeBorderColor etc.
source = ~/.config/omarchy-ubuntu/current/theme/hyprland.conf

source = ~/.config/hypr/envs.conf
source = ~/.config/hypr/monitors.conf
source = ~/.config/hypr/input.conf
source = ~/.config/hypr/looknfeel.conf
source = ~/.config/hypr/windows.conf
source = ~/.config/hypr/autostart.conf

# Keybindings (every binding uses bindd so Super + K can show a description)
source = ~/.config/hypr/bindings/apps.conf
source = ~/.config/hypr/bindings/tiling.conf
source = ~/.config/hypr/bindings/utilities.conf
source = ~/.config/hypr/bindings/media.conf
source = ~/.config/hypr/bindings/clipboard.conf

# Personal overrides that are not tracked in git (created empty by install.sh)
source = ~/.config/hypr/local.conf
