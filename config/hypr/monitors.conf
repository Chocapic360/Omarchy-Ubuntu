# See https://wiki.hypr.land/Configuring/Basics/Monitors/
# List outputs and modes: hyprctl monitors all
# Format: monitor = [port], resolution@rate, position, scale

# Dell 16 internal panel. If the name differs, check `hyprctl monitors`.
monitor = eDP-1, 1920x1200@60, 0x0, 1

# Text too small? 1.25 divides 1920x1200 cleanly (1536x960 logical):
# monitor = eDP-1, 1920x1200@60, 0x0, 1.25

# Any other monitor that gets plugged in: preferred mode, placed automatically
monitor = , preferred, auto, 1
