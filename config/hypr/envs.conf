# Cursor size
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

# Prefer Wayland for every toolkit
env = GDK_BACKEND,wayland,x11,*
env = QT_QPA_PLATFORM,wayland;xcb
env = MOZ_ENABLE_WAYLAND,1
env = ELECTRON_OZONE_PLATFORM_HINT,wayland
env = OZONE_PLATFORM,wayland
env = XDG_SESSION_TYPE,wayland

# Needed for screen sharing (Meet, Discord, etc.)
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_DESKTOP,Hyprland

# Dark purple GTK apps in this session only (GNOME keeps its own theme).
# Yaru-purple-dark ships with Ubuntu; libadwaita apps get the dark scheme.
env = GTK_THEME,Yaru-purple-dark
env = ADW_DEBUG_COLOR_SCHEME,prefer-dark

# 1920x1200 laptop panel at scale 1
env = GDK_SCALE,1

xwayland {
    force_zero_scaling = true
}

ecosystem {
    no_update_news = true
}
