# https://wiki.hypr.land/Configuring/Basics/Variables/#input
input {
    kb_layout = us
    kb_options = compose:caps

    repeat_rate = 40
    repeat_delay = 250
    numlock_by_default = true

    follow_mouse = 1
    sensitivity = 0 # -1.0 to 1.0

    touchpad {
        natural_scroll = true    # same direction as GNOME
        clickfinger_behavior = true   # two-finger click = right click
        scroll_factor = 0.4
        disable_while_typing = true
    }
}

misc {
    key_press_enables_dpms = true
    mouse_move_enables_dpms = true
}

# Scroll terminals a bit faster
windowrule = scroll_touchpad 1.5, match:class (Alacritty|kitty|foot)
windowrule = scroll_touchpad 0.2, match:class com.mitchellh.ghostty

# Three-finger swipe left/right to change workspace
gesture = 3, horizontal, workspace
