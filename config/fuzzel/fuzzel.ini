# Launcher styled after Omarchy's Walker: centred box, square corners, 2px accent border
include=~/.config/omarchy-ubuntu/current/theme/fuzzel.ini

[main]
font=JetBrainsMono Nerd Font:size=13
prompt="  "
placeholder=Search…
terminal=omu-launch-terminal -e
layer=overlay
anchor=center
width=40
lines=10
horizontal-pad=20
vertical-pad=16
inner-pad=10
line-height=24
icons-enabled=yes
icon-theme=Yaru
match-mode=fzf
show-actions=no
exit-on-keyboard-focus-loss=yes

[border]
width=2
radius=0
